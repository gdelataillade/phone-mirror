[package]
name = "phone-mirror-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "phone_mirror_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "../Vendor/idevice", default-features = false, features = ["ring", "usbmuxd", "core_device_proxy", "tunnel_tcp_stack", "display_stream", "tcp", "amfi", "mobile_image_mounter", "tss"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
plist = "1.8"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
plist-macro = "0.1.6"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 2
lto = "thin"
